name: mmx_core
description: >-
  Cross-platform triangle-mesh kernel: topology, BVH, repair, remeshing,
  decimation, SDF/voxel CSG, fabrication analysis, supports, packing, slicing.
version: 0.3.0
repository: https://github.com/palindsay/mmx
issue_tracker: https://github.com/palindsay/mmx/issues
topics:
  - mesh
  - geometry
  - 3d
  - dart
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.6
  args: ^2.7.0
  image: ^4.12.0
  meta: ^1.12.0
  xml: ^7.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
