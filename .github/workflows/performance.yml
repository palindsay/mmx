name: Performance evidence

on:
  workflow_dispatch:
    inputs:
      ui_samples:
        description: Independent native profile captures per OS (observational)
        type: choice
        default: '3'
        options: ['1', '3', '5']
  pull_request:
    paths:
      - '.github/workflows/performance.yml'
      - 'tool/performance_evidence.py'
      - 'tool/test_performance_evidence.py'
      - 'packages/mmx_core/tool/performance*.dart'
      - 'packages/mmx_core/test/performance_test.dart'
      - 'apps/mmx_studio/integration_test/desktop_performance.dart'
      - 'apps/mmx_studio/test_driver/desktop_performance_driver.dart'
      - 'apps/mmx_studio/native_renderer/**'
      - 'apps/mmx_studio/lib/render/**'
      - 'packages/mmx_core/lib/src/scene/document.dart'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    name: Observed performance (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MMX_PERF_PLATFORM: ${{ matrix.platform }}
      MMX_PERF_RUNNER_LABEL: ${{ matrix.os }}
      MMX_PERF_HOST_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
      MMX_PERF_UI_SAMPLES: ${{ inputs.ui_samples || '3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned native renderer toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if [ '${{ runner.os }}' = macOS ]; then
            rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb libvulkan1 mesa-vulkan-drivers
      - name: Evidence tooling regression tests
        run: python -B -m unittest discover -s tool -p 'test_performance_evidence.py'
      - name: AOT kernel and native profile evidence
        run: |
          python tool/performance_evidence.py \
            --platform "$MMX_PERF_PLATFORM" \
            --host-id "$MMX_PERF_HOST_ID" \
            --runner-label "$MMX_PERF_RUNNER_LABEL" \
            --environment github-hosted-observational \
            --ui-samples "$MMX_PERF_UI_SAMPLES" \
            --output "$RUNNER_TEMP/mmx-performance-evidence"
      - name: Publish observation summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mmx-performance-evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/mmx-performance-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmx-performance-evidence/
          if-no-files-found: warn
          retention-days: 30
