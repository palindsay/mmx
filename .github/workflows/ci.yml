name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned native renderer toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if [ '${{ runner.os }}' = macOS ]; then
            rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb libvulkan1 mesa-vulkan-drivers
      - name: Native renderer format and parser checks
        working-directory: apps/mmx_studio/native_renderer
        run: |
          cargo fmt --check
          cargo test --locked --release
          cargo clippy --locked --release --all-targets -- -D warnings
      - name: Verify kernel and Studio
        run: ./tool/verify.sh
      - name: Build and packaging regression tests
        run: |
          python -B -m unittest discover -s tool -p 'test_package_release.py'
          python -B -m unittest discover -s tool -p 'test_build.py'
      - name: Kernel coverage gate
        if: runner.os == 'Linux'
        run: ./tool/coverage.sh
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-coverage
          path: packages/mmx_core/coverage/lcov.info
      - name: Analytical geometry corpus
        working-directory: packages/mmx_core
        run: dart run tool/validate_corpus.dart > ../../analytical-corpus.json
      - name: Upload analytical report
        uses: actions/upload-artifact@v4
        with:
          name: analytical-corpus-${{ matrix.platform }}
          path: analytical-corpus.json
      - name: Desktop integration workflows
        working-directory: apps/mmx_studio
        run: |
          # Flutter 3.47.9 reuses a closed desktop log reader across test files.
          # A new Flutter invocation per file preserves every native test.
          for test_file in integration_test/*_test.dart; do
            if [ '${{ runner.os }}' = Linux ]; then
              dbus-run-session -- xvfb-run -a flutter test "$test_file" -d linux
            else
              flutter test "$test_file" -d '${{ matrix.platform }}'
            fi
          done
      - name: Build optimized CLI and desktop
        run: python tool/build.py --platform '${{ matrix.platform }}'
      - name: Native renderer depth and texture acceptance
        working-directory: apps/mmx_studio
        run: |
          case '${{ matrix.platform }}' in
            linux) MMX_GPU_LIBRARY="$PWD/build/linux/x64/release/bundle/lib/libmmx_gpu.so" ;;
            windows) MMX_GPU_LIBRARY="$PWD/build/windows/x64/runner/Release/mmx_gpu.dll" ;;
            macos) MMX_GPU_LIBRARY="$PWD/build/macos/Build/Products/Release/mmx_studio.app/Contents/Frameworks/libmmx_gpu.dylib" ;;
          esac
          export MMX_GPU_LIBRARY
          flutter test test/gpu_renderer_test.dart
          dart run tool/probe_gpu.dart --require-native > '../../gpu-${{ matrix.platform }}.json'
      - name: Upload native adapter capability
        uses: actions/upload-artifact@v4
        with:
          name: gpu-capability-${{ matrix.platform }}
          path: gpu-${{ matrix.platform }}.json
      - name: Record verified build inputs
        run: python tool/package_release.py '${{ matrix.platform }}' --record-build
      - name: Find Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = Get-ChildItem ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC not found' }
          "ISCC_PATH=$($iscc.FullName)" >> $env:GITHUB_ENV
      - name: Record toolchain and dependency inventory
        run: |
          flutter --version > toolchain.txt
          rustc +1.99.1 --version >> toolchain.txt
          git rev-parse HEAD >> toolchain.txt
          (cd apps/mmx_studio && flutter pub deps --json) > dependencies.json
          python tool/collect_licenses.py
      - name: Locate Windows redistributable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/release/find_windows_runtime.ps1
      - name: Package unsigned artifacts with checksums
        run: python tool/package_release.py '${{ matrix.platform }}' --native
      - name: Install and remove Linux package
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i bin/releases/*.deb
          python tool/verify_manifest.py /opt/mmx/provenance.json --root /opt/mmx
          /usr/bin/mmx --help
          xvfb-run -a python tool/smoke_desktop.py /usr/bin/mmx-studio
          sudo dpkg -r mmx
          test ! -e /opt/mmx/mmx
      - name: Install and remove macOS package
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg "$(find bin/releases -name '*.pkg' -print -quit)" -target /
          python tool/verify_manifest.py /usr/local/share/mmx/provenance.json --root /
          /usr/local/bin/mmx --help
          test -d '/Applications/mmx Studio.app'
          python tool/smoke_desktop.py '/Applications/mmx Studio.app/Contents/MacOS/mmx_studio'
          sudo rm -rf '/Applications/mmx Studio.app' /usr/local/share/mmx
          sudo rm /usr/local/bin/mmx
          sudo pkgutil --forget com.mmx.studio
      - name: Install and remove Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem bin/releases/*-windows-unsigned.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'mmx installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          python tool/verify_manifest.py "$destination/provenance.json" --root "$destination"
          if ($LASTEXITCODE -ne 0) { throw 'Installed manifest verification failed' }
          & "$destination/mmx.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          python tool/smoke_desktop.py "$destination/studio/mmx_studio.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop startup failed' }
          $uninstall = Start-Process -FilePath "$destination/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination/mmx.exe")) { throw 'Uninstall failed' }
      - name: Upload review artifacts (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mmx-${{ matrix.platform }}-${{ github.sha }}
          path: bin/releases/*
