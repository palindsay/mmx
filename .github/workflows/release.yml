name: Release

# Tag pushes (v*) build and publish a GitHub Release. A manual run builds all
# platforms; it publishes only when tag_name is given, otherwise it is a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v0.1.0). Leave empty for a build-only dry run.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PUBSPEC_VERSION="$(grep -m1 '^version:' packages/mmx_core/pubspec.yaml | awk '{print $2}' | tr -d '\r')"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            TAG=""
          fi

          if [[ -n "$TAG" ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH[-PRERELEASE] tag."
              exit 1
            fi
            VERSION="${TAG#v}"
            # Prerelease tags (v0.1.0-rc.1) must match the pubspec's base version.
            if [[ "${VERSION%%-*}" != "$PUBSPEC_VERSION" ]]; then
              echo "::error::Tag $TAG does not match packages/mmx_core/pubspec.yaml version $PUBSPEC_VERSION."
              exit 1
            fi
            PUBLISH=true
          else
            VERSION="$PUBSPEC_VERSION"
            PUBLISH=false
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, tag: ${TAG:-<none>}, publish: $PUBLISH"

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify kernel and Studio
        run: ./tool/verify.sh

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu image, so the Linux binaries run on the
          # widest range of glibc versions.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: all
          # Studio is a universal app, so it is built once on Apple silicon;
          # the Intel runner only builds the native x64 CLI.
          - os: macos-15
            platform: macos
            arch: arm64
            target: all
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: cli
          - os: windows-2025
            platform: windows
            arch: x64
            target: all

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build release packages
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./tool/build_release.sh --platform="$PLATFORM" --arch="$ARCH" --target="$TARGET" --version="$VERSION" --out-dir=dist --no-checksums

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mmx-artifacts-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mmx-artifacts-*
          path: release-assets
          merge-multiple: true

      - name: Compute checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true || contains(needs.prepare.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
